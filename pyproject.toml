[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "development-tools"
version = "0.1.0"
description = "Small, cross-platform utilities for software development"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
devtools = "devtools.cli:main"

[tool.setuptools]
packages = ["devtools"]
